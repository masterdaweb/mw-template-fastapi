# How the platform runs this app, kept with its code. A setting written here
# is read-only in the console: change it here and push.

[deploy]
# Once per deploy, before the new version takes traffic.
release_command = "python migrate.py"
start_command = "uvicorn main:app --host 0.0.0.0 --port $PORT"
health_check_path = "/health"
